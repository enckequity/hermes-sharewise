name: sharewise
version: 0.1.6
manifest_version: 2
api_version: 1
description: >-
  See what your photos and videos reveal before you share them. Reports, as yes/no only, location,
  time, device, IDs and hidden thumbnails, and makes verified copies without that metadata, videos
  without re-encoding. Originals are never changed. TeamShift fork: metadata-strip-only (no face or
  sign detection, review page or hiding) and the workspace's attachment folders are allowed.
author: ardianreffa
license: MIT
homepage: https://github.com/ardianreffa/sharewise
tags: [privacy, photos, videos, metadata, local]
requires_hermes: ">=0.22.6"
provides_tools:
  - sharewise_check
  - sharewise_share
provides_hooks:
  - pre_tool_call
# Pillow and pillow-heif come from the engine venv (the image proves both); numpy and pyobjc were for the removed hiding
# and Apple Vision detection.
